project:
  type: website
  output-dir: docs
  execute-dir: project
  # index.qmd va al final: lee los modelos que guarda analysis.qmd
  render:
    - processing/preparation.qmd
    - processing/analysis.qmd
    - processing/analysis_did_interes.qmd
    - processing/analysis_did_interes_ext.qmd
    - processing/analysis_gse.qmd
    - processing/analysis_jovenes.qmd
    - processing/analysis_ponderado.qmd
    - index.qmd

website:
  title: "Educación ciudadana y participación política"
  navbar:
    left:
      - href: index.qmd
        text: Presentación
      - href: processing/preparation.qmd
        text: Preparación
      - text: Análisis
        menu:
          - href: processing/analysis.qmd
            text: Regresiones y diferencia en diferencias 2x2
          - href: processing/analysis_did_interes.qmd
            text: Diferencia en diferencias escalonada
          - href: processing/analysis_did_interes_ext.qmd
            text: Diferencia en diferencias con olas 77 a 96
      - text: Robustez
        menu:
          - href: processing/analysis_gse.qmd
            text: Grupo socioeconómico
          - href: processing/analysis_jovenes.qmd
            text: Jóvenes
          - href: processing/analysis_ponderado.qmd
            text: Ponderadores y diseño muestral
  page-footer:
    center: "Kevin Carrasco"

format:
  html:
    theme: cosmo
    toc: true
    toc-title: Contenidos
    lang: es
    code-fold: true
    code-tools: true
    fig-align: center

execute:
  warning: false
  message: false
  echo: true
