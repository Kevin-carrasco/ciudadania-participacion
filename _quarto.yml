project:
  type: website
  output-dir: docs
  execute-dir: project
  # index.qmd va al final: lee los modelos que guarda analysis.qmd
  render:
    - processing/preparation.qmd
    - processing/analysis_principal.qmd
    - processing/analysis_regresiones.qmd
    - processing/analysis_did_2x2.qmd
    - processing/analysis_did_interes.qmd
    - processing/analysis_did_interes_ext.qmd
    - processing/analysis_ponderado.qmd
    - processing/analysis_confianza_politica.qmd
    - index.qmd

website:
  title: "Educación ciudadana y participación política"
  navbar:
    left:
      - href: index.qmd
        text: Presentación
      - href: processing/preparation.qmd
        text: Preparación
      - text: Análisis
        menu:
          - href: processing/analysis_principal.qmd
            text: Modelos principales
          - href: processing/analysis_regresiones.qmd
            text: Regresiones
          - href: processing/analysis_did_2x2.qmd
            text: Diferencia en diferencias 2x2
          - href: processing/analysis_did_interes.qmd
            text: Diferencia en diferencias escalonada
          - href: processing/analysis_did_interes_ext.qmd
            text: Olas 77 a 96 y estudio de eventos
          - href: processing/analysis_ponderado.qmd
            text: Ponderación y diseño muestral
      - href: processing/analysis_confianza_politica.qmd
        text: Confianza en instituciones
  page-footer:
    center: "Kevin Carrasco"

format:
  html:
    theme: cosmo
    toc: true
    toc-title: Contenidos
    lang: es
    code-fold: true
    code-tools: true
    fig-align: center

execute:
  warning: false
  message: false
  echo: true
